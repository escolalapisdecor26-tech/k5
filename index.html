<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relato Narrativo — Trilhas do Desenvolvimento · 5 anos</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy: #1B2A4A; --gold-light: #e8d9a0;
  --teal: #0F6E56; --teal-bg: #E1F5EE; --teal-border: #5DCAA5;
  --border: #e0ddd8; --bg: #f7f6f3; --surface: #ffffff;
  --text: #1a1a1a; --muted: #6b6b6b; --hint: #9b9b9b;
  --red: #c0392b; --red-bg: #fdf0ee;
}
body { font-family: Georgia,'Times New Roman',serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:16px; -webkit-text-size-adjust:100%; }
.app { max-width:780px; margin:0 auto; padding:1.25rem 1rem 5rem; }
.header { padding-bottom:1rem; border-bottom:1px solid var(--border); margin-bottom:1.25rem; }
.badge { display:inline-block; background:var(--teal-bg); color:var(--teal); font-family:system-ui,sans-serif; font-size:11px; font-weight:600; padding:3px 12px; border-radius:99px; border:1px solid var(--teal-border); margin-bottom:8px; letter-spacing:.05em; }
.header h1 { font-size:20px; font-weight:400; color:var(--navy); line-height:1.3; }
.header p { font-size:13px; color:var(--muted); margin-top:4px; font-family:system-ui,sans-serif; }
.aluno-grid { display:grid; grid-template-columns:1fr; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem; margin-bottom:1rem; }
.field-lbl { font-family:system-ui,sans-serif; font-size:10px; font-weight:700; color:var(--hint); text-transform:uppercase; letter-spacing:.07em; margin-bottom:5px; }
.aluno-grid input, .aluno-grid select { width:100%; font-family:system-ui,sans-serif; font-size:16px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); appearance:none; -webkit-appearance:none; }
.aluno-grid input:focus, .aluno-grid select:focus { outline:none; border-color:var(--navy); }
.sexo-row { display:flex; gap:10px; }
.sexo-btn { flex:1; font-family:system-ui,sans-serif; font-size:14px; padding:10px; border-radius:8px; border:1.5px solid var(--border); background:var(--bg); color:var(--muted); cursor:pointer; text-align:center; transition:all .15s; -webkit-tap-highlight-color:transparent; }
.sexo-btn.ativo { border-color:var(--navy); background:var(--navy); color:var(--gold-light); font-weight:600; }
.prog-bar { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:1rem; }
.prog-track { flex:1; height:6px; background:var(--border); border-radius:99px; overflow:hidden; }
.prog-fill { height:100%; background:var(--navy); border-radius:99px; width:0%; transition:width .3s ease; }
.prog-lbl { font-family:system-ui,sans-serif; font-size:12px; color:var(--muted); min-width:50px; text-align:right; white-space:nowrap; }
.tabs-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:1rem; padding-bottom:4px; }
.tabs-scroll::-webkit-scrollbar { display:none; }
.tabs-row { display:flex; gap:6px; width:max-content; }
.tab-btn { font-family:system-ui,sans-serif; font-size:13px; padding:8px 16px; border-radius:99px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; white-space:nowrap; min-height:36px; -webkit-tap-highlight-color:transparent; }
.tab-btn.ativa { background:var(--navy); color:var(--gold-light); border-color:var(--navy); }
.domain-section { display:none; }
.domain-section.vis { display:block; animation:fadein .15s ease; }
@keyframes fadein { from{opacity:0} to{opacity:1} }
.domain-titulo { font-family:system-ui,sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.sub-lbl { font-family:system-ui,sans-serif; font-size:12px; color:var(--hint); font-style:italic; margin:14px 0 6px; }
.item-row { display:flex; align-items:flex-start; gap:12px; padding:11px 6px; border-bottom:1px solid #f0ede8; cursor:pointer; border-radius:6px; -webkit-tap-highlight-color:transparent; }
.item-row:last-child { border-bottom:none; }
.item-row:active { background:#f0ede8; }
.item-row input[type=checkbox] { margin-top:2px; flex-shrink:0; width:20px; height:20px; accent-color:var(--navy); cursor:pointer; }
.item-row label { font-family:system-ui,sans-serif; font-size:14px; color:var(--text); line-height:1.55; cursor:pointer; }
.item-row.marcado label { color:var(--hint); text-decoration:line-through; }
.sep { border:none; border-top:1px solid var(--border); margin:1.75rem 0 1.25rem; }
.sec-titulo { font-size:16px; font-weight:400; color:var(--navy); margin-bottom:4px; }
.sec-hint { font-family:system-ui,sans-serif; font-size:13px; color:var(--hint); margin-bottom:10px; }
.obs-area { width:100%; min-height:90px; font-family:system-ui,sans-serif; font-size:16px; padding:12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--text); resize:vertical; line-height:1.6; margin-bottom:14px; }
.obs-area:focus { outline:none; border-color:var(--navy); }
.btn-row { display:flex; flex-direction:column; gap:10px; }
.btn-gerar { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:var(--navy); color:var(--gold-light); font-family:system-ui,sans-serif; font-size:15px; font-weight:600; padding:14px 22px; border-radius:10px; border:none; cursor:pointer; min-height:50px; -webkit-tap-highlight-color:transparent; }
.btn-gerar:active { opacity:.85; }
.btn-sec { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; font-family:system-ui,sans-serif; font-size:14px; padding:12px 16px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; min-height:46px; -webkit-tap-highlight-color:transparent; }
.btn-sec:active { background:#f0ede8; }
.erro-box { margin-top:12px; padding:12px 14px; background:var(--red-bg); border:1px solid #f5c6c0; border-radius:8px; font-family:system-ui,sans-serif; font-size:14px; color:var(--red); display:none; }
.relato-box { margin-top:1.5rem; background:var(--surface); border-radius:10px; border:1px solid var(--border); padding:1.25rem; }
.relato-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); gap:8px; }
.relato-etiq { font-family:system-ui,sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); }
.btn-copiar { font-family:system-ui,sans-serif; font-size:13px; font-weight:600; padding:8px 18px; border-radius:99px; border:1px solid var(--navy); background:var(--navy); color:var(--gold-light); cursor:pointer; white-space:nowrap; min-height:36px; -webkit-tap-highlight-color:transparent; }
.btn-copiar.ok { background:var(--teal-bg); color:var(--teal); border-color:var(--teal-border); }
.relato-txt { font-size:15px; line-height:1.9; color:var(--text); white-space:pre-wrap; }
@media(min-width:600px){
  .app{padding:2rem 1.5rem 4rem;}
  .aluno-grid{grid-template-columns:2fr 1fr 1fr 1fr;}
  .tabs-scroll{overflow-x:visible;}
  .tabs-row{width:auto;flex-wrap:wrap;}
  .tab-btn{font-size:12px;padding:5px 13px;min-height:auto;}
  .btn-row{flex-direction:row;}
  .btn-gerar{width:auto;min-height:auto;padding:10px 22px;font-size:13px;}
  .btn-sec{width:auto;min-height:auto;padding:9px 16px;font-size:13px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="badge">Trilhas do Desenvolvimento · 5 anos</div>
    <h1>Relato Narrativo do Portfólio</h1>
    <p>Escola Projeto Lápis de Cor · Educação Infantil</p>
  </div>

  <div class="aluno-grid">

        <div class="sexo-btn" id="sexo-m" onclick="setSexo('M')">♂ Menino</div>
      </div>
    </div>
    <div>
      <div class="field-lbl">Professora</div>
      <input id="f-prof" type="text" placeholder="Nome da professora">
    </div>
    <div>
      <div class="field-lbl">Trimestre</div>
      <select id="f-periodo">
        <option value="1º trimestre">1º trimestre</option>
        <option value="2º trimestre">2º trimestre</option>
        <option value="3º trimestre">3º trimestre</option>
      </select>
    </div>
  </div>

  <div class="prog-bar">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <div class="prog-track"><div class="prog-fill" id="pfill"></div></div>
    <span class="prog-lbl" id="plbl">0 / 0</span>
  </div>

  <div class="tabs-scroll"><div class="tabs-row" id="tabs-row"></div></div>
  <div id="domains-wrap"></div>

  <hr class="sep">
  <h2 class="sec-titulo">Observações complementares</h2>
  <p class="sec-hint">Acrescente observações livres que enriquecem o relato (opcional).</p>
  <textarea class="obs-area" id="obs" placeholder="Ex.: Demonstra grande interesse por histórias, adora explorar a área externa..."></textarea>
  <div class="btn-row">
    <button class="btn-gerar" onclick="gerarRelato()">✦ Gerar relato narrativo</button>
    <button class="btn-sec" onclick="limpar()">↺ Limpar tudo</button>
  </div>
  <div class="erro-box" id="erro-box"></div>

  <div id="relato-box" style="display:none" class="relato-box">
    <div class="relato-hdr">
      <span class="relato-etiq">Relato gerado</span>
      <button class="btn-copiar" id="btn-cp" onclick="copiar()">Copiar texto</button>
    </div>
    <div class="relato-txt" id="relato-txt"></div>
  </div>
</div>

<script>
// ─── GÊNERO ──────────────────────────────────────────────────────────────────
let SEXO = 'F';

function setSexo(s) {
  SEXO = s;
  document.getElementById('sexo-f').classList.toggle('ativo', s==='F');
  document.getElementById('sexo-m').classList.toggle('ativo', s==='M');
}

function aplicarGenero(txt, sexo) {
  const M = sexo === 'M';
  const i = M ? 0 : 1;
  txt = txt.replace(/{O\/A}/g,                  ['O','A'][i]);
  txt = txt.replace(/{o\/a}/g,                  ['o','a'][i]);
  txt = txt.replace(/{Ele\/Ela}/g,              ['Ele','Ela'][i]);
  txt = txt.replace(/{ele\/ela}/g,              ['ele','ela'][i]);
  txt = txt.replace(/{do\/da}/g,               ['do','da'][i]);
  txt = txt.replace(/{no\/na}/g,               ['no','na'][i]);
  txt = txt.replace(/{ao\/à}/g,                ['ao','à'][i]);
  txt = txt.replace(/{um\/uma}/g,              ['um','uma'][i]);
  txt = txt.replace(/{seu\/sua}/g,             ['seu','sua'][i]);
  txt = txt.replace(/{seus\/suas}/g,           ['seus','suas'][i]);
  txt = txt.replace(/{dele\/dela}/g,           ['dele','dela'][i]);
  txt = txt.replace(/{proprio\/propria}/g,     ['próprio','própria'][i]);
  txt = txt.replace(/{mesmo\/mesma}/g,         ['mesmo','mesma'][i]);
  txt = txt.replace(/{sozinho\/sozinha}/g,     ['sozinho','sozinha'][i]);
  txt = txt.replace(/{contrariado\/contrariada}/g, ['contrariado','contrariada'][i]);
  txt = txt.replace(/{molhado\/molhada}/g,     ['molhado','molhada'][i]);
  txt = txt.replace(/{satisfeito\/satisfeita}/g,['satisfeito','satisfeita'][i]);
  txt = txt.replace(/{engajado\/engajada}/g,   ['engajado','engajada'][i]);
  txt = txt.replace(/{seguro\/segura}/g,       ['seguro','segura'][i]);
  txt = txt.replace(/{ativo\/ativa}/g,         ['ativo','ativa'][i]);
  txt = txt.replace(/{curioso\/curiosa}/g,     ['curioso','curiosa'][i]);
  txt = txt.replace(/{aluno\/aluna}/g,         ['aluno','aluna'][i]);
  txt = txt.replace(/{pronto\/pronta}/g,       ['pronto','pronta'][i]);
  txt = txt.replace(/{independente}/g,         'independente');
  txt = txt.replace(/{sua\/sua}/g,             ['seu','sua'][i]);
  txt = txt.replace(/{suas}/g,                 'suas');
  txt = txt.replace(/{sua}/g,                  'sua');
  txt = txt.replace(/\{[^}]+\}/g, '');
  return txt;
}

const TOTAL = DOMINIOS.reduce((a,d)=>a+d.grupos.reduce((b,g)=>b+g.itens.length,0),0);
const marcados = {};

function construir() {
  const tabsRow = document.getElementById('tabs-row');
  const wrap = document.getElementById('domains-wrap');
  document.getElementById('plbl').textContent = '0 / ' + TOTAL;
  DOMINIOS.forEach((dom, di) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (di===0?' ativa':'');
    btn.textContent = dom.label;
    btn.onclick = () => trocarAba(di);
    tabsRow.appendChild(btn);
    const sec = document.createElement('div');
    sec.className = 'domain-section' + (di===0?' vis':'');
    sec.id = 'sec-'+di;
    let html = `<div class="domain-titulo">${di+1}. ${dom.label}</div>`;
    dom.grupos.forEach((g, gi) => {
      html += `<div class="sub-lbl">${g.sub}</div>`;
      g.itens.forEach((item, ii) => {
        const id = `ck_${di}_${gi}_${ii}`;
        marcados[id] = false;
        html += `<div class="item-row" id="row_${id}" onclick="alternar(event,'${id}')"><input type="checkbox" id="${id}"><label for="${id}">${item}</label></div>`;
      });
    });
    sec.innerHTML = html;
    wrap.appendChild(sec);
  });
}

function trocarAba(di) {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('ativa',i===di));
  document.querySelectorAll('.domain-section').forEach((s,i)=>s.classList.toggle('vis',i===di));
}

function alternar(e, id) {
  const el = document.getElementById(id);
  if (e.target !== el) el.checked = !el.checked;
  marcados[id] = el.checked;
  document.getElementById('row_'+id).classList.toggle('marcado', el.checked);
  const n = Object.values(marcados).filter(Boolean).length;
  document.getElementById('pfill').style.width = Math.round(n/TOTAL*100)+'%';
  document.getElementById('plbl').textContent = n+' / '+TOTAL;
}

function pick(arr, seed) { return arr[seed % arr.length]; }

function gerarRelato() {
  const nomeRaw = document.getElementById('f-nome').value.trim();
  const nome = nomeRaw || (SEXO==='M' ? 'o aluno' : 'a aluna');
  const periodo = document.getElementById('f-periodo').value;
  const obs = document.getElementById('obs').value.trim();

  const selecionados = [];
  DOMINIOS.forEach((d,di) => d.grupos.forEach((g,gi) => g.itens.forEach((item,ii) => {
    if (marcados[`ck_${di}_${gi}_${ii}`]) selecionados.push(item);
  })));

  if (!selecionados.length && !obs) {
    const e = document.getElementById('erro-box');
    e.textContent = 'Selecione ao menos um indicador ou adicione observações complementares.';
    e.style.display = 'block'; return;
  }
  document.getElementById('erro-box').style.display = 'none';

  const porDominio = DOMINIOS.map((d,di) => {
    const itens = [];
    d.grupos.forEach((g,gi) => g.itens.forEach((item,ii) => {
      if (marcados[`ck_${di}_${gi}_${ii}`]) itens.push(item);
    }));
    return { label: d.label, itens };
  }).filter(d => d.itens.length > 0);

  let seed = 0;
  for (let c of nome) seed += c.charCodeAt(0);
  const N = nome.split(' ')[0];

  let partes = [];
  const abertura = pick(ABERTURAS, seed).replace(/{N}/g, N).replace(/{P}/g, periodo);
  partes.push(aplicarGenero(abertura, SEXO));

  const blocos = [
    { dominios: ["Socioemocional", "Conduta Escolar"] },
    { dominios: ["Funções Executivas", "Cognitivo", "Curiosidade Investigativa"] },
    { dominios: ["Linguagem", "Alfabetização Emergente"] },
    { dominios: ["Motor", "Expressão Artística", "Brincadeira Simbólica"] },
    { dominios: ["Temporal/Espacial", "Autonomia"] }
  ];

  blocos.forEach((bloco, bi) => {
    const frases = [];
    bloco.dominios.forEach(nomeDom => {
      const dom = porDominio.find(d => d.label === nomeDom);
      if (!dom) return;
      dom.itens.forEach((item, ii) => {
        const opcoes = FRASES[item];
        if (opcoes) {
          const frase = pick(opcoes, seed + bi + ii).replace(/{N}/g, N);
          frases.push(aplicarGenero(frase, SEXO));
        }
      });
    });
    if (frases.length > 0) partes.push(frases.join(' '));
  });

  // Observações complementares: integradas ao último parágrafo temático
  if (obs) {
    const obsFormatada = obs.charAt(0).toLowerCase() + obs.slice(1);
    const obsFinal = /[.!?]$/.test(obsFormatada.trim()) ? obsFormatada.trim() : obsFormatada.trim() + '.';
    const conectores = [
      ' Vale acrescentar que ',
      ' A professora destaca ainda que ',
      ' Completando este retrato, ',
      ' Além disso, '
    ];
    const conector = conectores[seed % conectores.length];
    // Funde ao último parágrafo temático (o último item de partes antes do encerramento)
    if (partes.length > 1) {
      partes[partes.length - 1] += conector + obsFinal;
    } else {
      partes.push(obsFinal);
    }
  }

  const enc = pick(ENCERRAMENTOS, seed + 1).replace(/{N}/g, N);
  partes.push(aplicarGenero(enc, SEXO));

  document.getElementById('relato-txt').textContent = partes.join('\n\n');
  const box = document.getElementById('relato-box');
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copiar() {
  const t = document.getElementById('relato-txt').textContent;
  const b = document.getElementById('btn-cp');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(() => feedback(b)).catch(() => fallback(t, b));
  } else { fallback(t, b); }
}
function feedback(btn) {
  btn.classList.add('ok'); btn.textContent = '✓ Copiado!';
  setTimeout(() => { btn.classList.remove('ok'); btn.textContent = 'Copiar texto'; }, 2000);
}
function fallback(texto, btn) {
  const ta = document.createElement('textarea');
  ta.value = texto; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand('copy'); feedback(btn); } catch(e) { alert('Selecione o texto manualmente e copie com Ctrl+C.'); }
  document.body.removeChild(ta);
}

function limpar() {
  if (!confirm('Limpar todos os indicadores marcados?')) return;
  Object.keys(marcados).forEach(id => {
    marcados[id] = false;
    const el = document.getElementById(id); if (el) el.checked = false;
    const row = document.getElementById('row_'+id); if (row) row.classList.remove('marcado');
  });
  document.getElementById('obs').value = '';
  document.getElementById('relato-box').style.display = 'none';
  document.getElementById('relato-txt').textContent = '';
  document.getElementById('pfill').style.width = '0%';
  document.getElementById('plbl').textContent = '0 / '+TOTAL;
  document.getElementById('erro-box').style.display = 'none';
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', construir);
} else {
  construir();
}
</script>
